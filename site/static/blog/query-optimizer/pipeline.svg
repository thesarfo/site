<text x="400.0" y="110" fill="#8a8a8a" font-size="11" text-anchor="middle" font-weight="400">safe changes</text>
<line x1="448.0" y1="67" x2="457.6666666666667" y2="67" stroke="#8a8a8a" stroke-width="1.5"/>
