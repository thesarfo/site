<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" font-family="Inter, system-ui, sans-serif">
<text x="20" y="22" fill="#8a8a8a" font-size="13" text-anchor="start" font-weight="600">The trip a query makes</text>
