<text x="288.33333333333337" y="110" fill="#8a8a8a" font-size="11" text-anchor="middle" font-weight="400">a tree of steps</text>
<line x1="336.33333333333337" y1="67" x2="346.00000000000006" y2="67" stroke="#8a8a8a" stroke-width="1.5"/>
<polygon points="352.00000000000006,67 345.00000000000006,63 345.00000000000006,71" fill="#8a8a8a"/>
