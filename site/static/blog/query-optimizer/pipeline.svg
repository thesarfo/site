<text x="511.6666666666667" y="110" fill="#8a8a8a" font-size="11" text-anchor="middle" font-weight="400">guess row counts</text>
<line x1="559.6666666666667" y1="67" x2="569.3333333333334" y2="67" stroke="#8a8a8a" stroke-width="1.5"/>
