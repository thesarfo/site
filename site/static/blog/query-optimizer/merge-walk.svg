<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, system-ui, sans-serif">
<text x="20" y="28" fill="#8a8a8a" font-size="13" font-weight="600">A merge join: two sorted lists, one finger on each</text>
<g font-size="14" text-anchor="middle" fill="#8a8a8a">
<text x="120" y="70" font-size="12">left key</text><text x="360" y="70" font-size="12">right key</text></g>
<g fill="none" stroke="#8a8a8a" stroke-width="1">
<rect x="90" y="85" width="60" height="30"/><rect x="90" y="115" width="60" height="30"/><rect x="90" y="145" width="60" height="30"/><rect x="90" y="175" width="60" height="30"/>
<rect x="330" y="85" width="60" height="30"/><rect x="330" y="115" width="60" height="30"/><rect x="330" y="145" width="60" height="30"/><rect x="330" y="175" width="60" height="30"/></g>
<g font-size="15" text-anchor="middle" fill="#2f4f6f" font-weight="600">
<text x="120" y="106">1</text><text x="120" y="136">2</text><text x="120" y="166">2</text><text x="120" y="196">4</text>
<text x="360" y="106">1</text><text x="360" y="136">2</text><text x="360" y="166">3</text><text x="360" y="196">4</text></g>
<g font-size="12" fill="#8a8a8a"><text x="440" y="106">1 = 1: emit the pair, move both</text><text x="440" y="136">2 = 2: emit, then the next left 2 meets the same right 2</text><text x="440" y="166">2 &lt; 3: the left key is behind, move left</text><text x="440" y="196">4 = 4: emit, done</text></g>
<text x="20" y="260" fill="#8a8a8a" font-size="11">The finger on the smaller key always moves. Each row is touched once, and nothing is built in memory but the current run of equal keys.</text>
</svg>
