<line x1="170" y1="163" x2="300" y2="88" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="88" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="300" y="118" width="170" height="40" rx="7" fill="#2f4f6f"/>
<text x="385.0" y="135.0" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Each rule off</text>
<text x="385.0" y="151.0" fill="#fff" fill-opacity="0.8" font-size="9" text-anchor="middle">one at a time</text>
<line x1="170" y1="163" x2="300" y2="138" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="138" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="300" y="168" width="170" height="40" rx="7" fill="#2f4f6f"/>
<text x="385.0" y="192.2" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Each rule alone</text>
<line x1="170" y1="163" x2="300" y2="188" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="188" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="300" y="218" width="170" height="40" rx="7" fill="#2f4f6f"/>
<text x="385.0" y="235.0" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Hash joins</text>
<text x="385.0" y="251.0" fill="#fff" fill-opacity="0.8" font-size="9" text-anchor="middle">either side</text>
<line x1="170" y1="163" x2="300" y2="238" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="238" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="300" y="268" width="170" height="40" rx="7" fill="#2f4f6f"/>
<text x="385.0" y="285.0" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Nested loops</text>
<text x="385.0" y="301.0" fill="#fff" fill-opacity="0.8" font-size="9" text-anchor="middle">forced</text>
<line x1="170" y1="163" x2="300" y2="288" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="288" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
