<text x="665.0" y="167.9" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Same answer?</text>
<text x="665" y="215" fill="#8a8a8a" font-size="11" text-anchor="middle" font-weight="400">if any differ, shrink the query</text>
