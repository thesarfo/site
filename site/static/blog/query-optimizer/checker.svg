<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, system-ui, sans-serif">
<rect x="20" y="135" width="150" height="56" rx="7" fill="#2f4f6f"/>
<text x="95.0" y="167.9" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">One query</text>
