<text x="385.0" y="51.0" fill="#fff" fill-opacity="0.8" font-size="9" text-anchor="middle">the reference</text>
<line x1="170" y1="163" x2="300" y2="38" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="470" y1="38" x2="590" y2="163" stroke="#8a8a8a" stroke-width="1.5"/>
